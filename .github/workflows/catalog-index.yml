name: Catalog Index

# Publishes the slim publication index the device searches in Buscar.
#
# Deliberately NOT a firmware release asset. An 18 KB data change must not
# require a 5.6 MB OTA and an app0/app1 flash cycle, and it must not ride on the
# releases/latest semantics that already produced an rc-versus-release ordering
# problem here. It goes to its own fixed tag instead, on its own schedule.
#
# Three files per language share that tag:
#   catalog-<lang>.txt{,.gz}     v1, for firmware that predates the EPUB flag
#   catalog-<lang>.v2.txt{,.gz}  v2, with the flag; what current firmware reads
#   catalog-<lang>.probes.tsv    the probe cache that lets each entry be asked
#                                about once, not once a week
#
# Retiring v1. Firmware from v1.17.4 (published 2026-09-27) fetches only v2;
# v1 exists for devices still on v1.17.3 or older. Stop publishing it once BOTH
# hold: it is on or after 2026-12-28, and no supported device is still on
# v1.17.3 or older (Settings shows the version). Download counts cannot tell:
# every asset is re-uploaded with --clobber each week, which resets its count.
# Steps:
#   1. Here: drop --out-v1/--previous-v1 from both builder calls, the
#      previous-$lang.txt fetch, and "catalog-$lang.txt" from publish()'s
#      indexes, leaving the v2 files there outside hold.
#   2. Delete the assets, one per call:
#        for a in catalog-S.txt catalog-S.txt.gz catalog-E.txt catalog-E.txt.gz; do
#          gh release delete-asset catalog "$a" --yes --repo victorstein/berean-os
#        done
#   3. scripts/build_catalog_index.py: remove --out-v1/--previous-v1, the
#      legacy render_index(..., LEGACY_FORMAT_VERSION, ...) and its write,
#      LEGACY_FORMAT_VERSION, and the v1 wording in the module and render_index
#      docstrings; drop their tests in scripts/tests/test_build_catalog_index.py.
#   4. docs/file-formats.md and the comment in CatalogIndexStore::assetUrl().
#      The device still accepts a v1 file, so no firmware change is needed.

on:
  schedule:
    # Weekly. The catalog changes when publications are released, not daily, and
    # each run pulls 57.6 MB from someone else's CDN.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    # Two languages at the 1,500 s probing budget each, plus the catalog download.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch the previous index and probe cache
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # What exists is read from the release listing, never inferred from a
          # failed download. A transient failure taken for "never published"
          # would wipe the probe cache, or stop probing for good.
          #   probe  normal run
          #   seed   v2 published, cache missing: rebuild the cache from v2's flags
          #   hold   something listed could not be fetched, or the listing failed:
          #          no probing, and no v2 or cache published for that language
          base="https://github.com/${{ github.repository }}/releases/download/catalog"
          listing_ok=1
          assets="$(gh release view catalog --repo "${{ github.repository }}" --json assets -q '.assets[].name')" \
            || listing_ok=0
          listed() { printf '%s\n' "$assets" | grep -qxF "$1"; }
          for lang in S E; do
            # curl -f can leave a partial file behind; a truncated file must not be
            # read as last week's data.
            curl -sfL -o "previous-$lang.txt" "$base/catalog-$lang.txt" || rm -f "previous-$lang.txt"
            mode=probe
            if [ "$listing_ok" != 1 ]; then
              mode=hold
            else
              if listed "catalog-$lang.v2.txt" && ! curl -sfL -o "previous-$lang.v2.txt" "$base/catalog-$lang.v2.txt"; then
                rm -f "previous-$lang.v2.txt"
                mode=hold
              fi
              if listed "catalog-$lang.probes.tsv" \
                  && ! curl -sfL -o "previous-$lang.probes.tsv" "$base/catalog-$lang.probes.tsv"; then
                rm -f "previous-$lang.probes.tsv"
                mode=hold
              fi
              if [ "$mode" = probe ] && listed "catalog-$lang.v2.txt" && ! listed "catalog-$lang.probes.tsv"; then
                mode=seed
              fi
            fi
            echo "mode_$lang=$mode" >> "$GITHUB_OUTPUT"
            echo "catalog-$lang: $mode"
          done

      - name: Build the Spanish index
        id: spanish
        run: |
          set +e
          args=(--language-id 1 --language-code S
                --out catalog-S.v2.txt --previous previous-S.v2.txt
                --out-v1 catalog-S.txt --previous-v1 previous-S.txt
                --probes-out catalog-S.probes.tsv
                --throttle-marker "$GITHUB_OUTPUT")
          case "${{ steps.previous.outputs.mode_S }}" in
            hold) args+=(--no-probe) ;;
            seed) args+=(--seed-from-v2 previous-S.v2.txt) ;;
          esac
          [ -f previous-S.probes.tsv ] && args+=(--probes-in previous-S.probes.tsv)
          # No --db: this step downloads and inflates catalog.db, which the
          # English step then reuses.
          python3 scripts/build_catalog_index.py "${args[@]}"
          echo "status=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Build the English index
        id: english
        run: |
          set +e
          args=(--language-id 0 --language-code E --db catalog.db
                --out catalog-E.v2.txt --previous previous-E.v2.txt
                --out-v1 catalog-E.txt --previous-v1 previous-E.txt
                --probes-out catalog-E.probes.tsv)
          case "${{ steps.previous.outputs.mode_E }}" in
            hold) args+=(--no-probe) ;;
            seed) args+=(--seed-from-v2 previous-E.v2.txt) ;;
          esac
          # A 429 or 5xx while probing Spanish ends probing for the whole run. It
          # is added on top of the mode, never instead of it: dropping the seed
          # would publish a v2 with every flag emptied.
          if [ "${{ steps.spanish.outputs.throttled }}" = 1 ]; then
            args+=(--no-probe)
          fi
          [ -f previous-E.probes.tsv ] && args+=(--probes-in previous-E.probes.tsv)
          # Reuses the catalog.db the Spanish step already inflated, so the
          # 57.6 MB transfer happens once per run rather than once per language.
          python3 scripts/build_catalog_index.py "${args[@]}"
          echo "status=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Publish
        # Exit 3 means neither index's records changed, but the probe cache may
        # still have (a re-probed negative changes only its date), so 3 publishes
        # too. Any other non-zero is a real failure and must not silently leave
        # the old index in place looking fresh.
        if: >-
          steps.spanish.outputs.status == '0' || steps.spanish.outputs.status == '3' ||
          steps.english.outputs.status == '0' || steps.english.outputs.status == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view catalog --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create catalog \
                 --repo "${{ github.repository }}" \
                 --title "Publication catalog index" \
                 --notes "Slim per-language index built from JW Library's published catalog. Symbols, issue codes, years, titles and an EPUB-availability flag only. Rebuilt weekly; replaced in place, so the download URL is stable." \
                 --latest=false
          publish() {
            local lang="$1" status="$2" mode="$3"
            case "$status" in 0|3) ;; *) return 0 ;; esac
            local indexes=("catalog-$lang.txt")
            [ "$mode" != hold ] && indexes+=("catalog-$lang.v2.txt")
            # The device fetches the .gz: ~20 KB over the wire against ~245 KB,
            # and it already carries a deflate decoder. The plain .txt stays
            # published because the next run diffs against it, and because a
            # device whose inflate fails can still read it. An index the builder
            # did not rewrite this run does not exist here and is skipped.
            for f in "${indexes[@]}"; do
              [ -f "$f" ] || continue
              # -n omits the timestamp and original name, so an unchanged index
              # compresses to the same bytes every week.
              gzip -9 -n -c "$f" > "$f.gz"
              gh release upload catalog "$f" "$f.gz" --repo "${{ github.repository }}" --clobber
            done
            if [ "$mode" != hold ] && [ -f "catalog-$lang.probes.tsv" ]; then
              gh release upload catalog "catalog-$lang.probes.tsv" --repo "${{ github.repository }}" --clobber
            fi
          }
          publish S "${{ steps.spanish.outputs.status }}" "${{ steps.previous.outputs.mode_S }}"
          publish E "${{ steps.english.outputs.status }}" "${{ steps.previous.outputs.mode_E }}"

      - name: Fail loudly on a real error
        if: >-
          (steps.spanish.outputs.status != '0' && steps.spanish.outputs.status != '3') ||
          (steps.english.outputs.status != '0' && steps.english.outputs.status != '3')
        run: |
          echo "Spanish index build exited ${{ steps.spanish.outputs.status }}"
          echo "English index build exited ${{ steps.english.outputs.status }}"
          exit 1
