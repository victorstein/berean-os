name: Publish Release Firmware

# Builds the release firmware and attaches it to the release release-please has
# already cut, with the .bin named exactly as OtaUpdater requests it from the
# GitHub release: firmware-x4pro.bin, matching the compiled board tag.
#
# Dispatch-only, never tag-triggered: release-please cuts its tag with
# GITHUB_TOKEN, and a GITHUB_TOKEN-created tag does not trigger workflows.
# stein-infra's tofu-managed release-please fires this via
# `gh workflow run release-publish.yml` after the tag exists.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve latest release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release-please created the release just before this workflow was
          # fired, so the latest release is the one to publish artifacts for.
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          if [ -z "$TAG" ]; then
            echo "::error::No release found to publish artifacts for."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-release:
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: x4pro-gh_release
            asset: firmware-x4pro.bin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          submodules: recursive

      - uses: ./.github/actions/setup-platformio
        with:
          save-cache: 'true'

      - name: Build firmware
        run: pio run -e ${{ matrix.pio_env }}

      # OtaUpdater compares the release tag against the compiled BEREAN_VERSION;
      # a binary reporting any other version would be offered as an update forever.
      - name: Verify compiled version matches the tag
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          # The version is matched as a whole token inside any string, not as a
          # line of its own: the linker may keep the bare literal only as the tail
          # of "bereanOS-ESP32-<version>", and strings joins adjacent printable
          # bytes. Written to a file, not piped: grep -q would SIGPIPE strings
          # under pipefail. The matches are printed so a failure shows its evidence.
          strings ".pio/build/${{ matrix.pio_env }}/firmware.bin" > firmware-strings.txt
          token="(^|[^0-9.])${version//./\\.}($|[^0-9.])"
          echo "Strings mentioning $version:"
          grep -F -- "$version" firmware-strings.txt | head -n 10 || true
          if ! grep -Eq -- "$token" firmware-strings.txt; then
            echo "::error::firmware.bin does not contain BEREAN_VERSION \"$version\" for tag $TAG."
            exit 1
          fi

      - name: Name release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
              ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin

  publish-release:
    needs: [resolve-tag, build-release]
    runs-on: ubuntu-latest
    # Only this fork publishes; a downstream fork of it builds but stays silent.
    if: github.repository == 'victorstein/berean-os'
    permissions:
      # A job-level block replaces the workflow's top-level `contents: read`.
      contents: write
    steps:
      - name: Download board artifacts
        uses: actions/download-artifact@v4
        with:
          # One directory per artifact. merge-multiple would collide: every board
          # ships its own bootloader.bin and partitions.bin under the same name.
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          # All four boards are attached, not just one: the device picks the asset
          # name from its own board tag, so a missing board finds nothing to update
          # from. release-please already created the release, so this only uploads;
          # --clobber keeps a re-dispatch idempotent.
          gh release upload "$TAG" dist/*/firmware*.bin \
            --repo "$GITHUB_REPOSITORY" --clobber
