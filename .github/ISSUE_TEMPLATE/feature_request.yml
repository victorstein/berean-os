name: Feature Request
description: Propose a feature, enhancement, or change to bereanOS
title: "Short, descriptive title of the request"
labels: ["enhancement", "needs-scope-review"]
body:
  - type: markdown
    attributes:
      value: |
        **Read [SCOPE.md](https://github.com/victorstein/berean-os/blob/main/SCOPE.md) and [ROADMAP.md](https://github.com/victorstein/berean-os/blob/main/ROADMAP.md) first.**

        bereanOS is a study device, not a general e-reader and not a tablet. Most rejected proposals
        are rejected for a reason already written down, and SCOPE.md gives the reasoning rather than
        just the verdict — so a proposal that argues against the reasoning has somewhere to start.

  - type: checkboxes
    id: scope-check
    attributes:
      label: Scope self-check (required)
      description: Confirm each of these. If any is unchecked, say why in the request itself.
      options:
        - label: I have read SCOPE.md and ROADMAP.md.
          required: true
        - label: This is **not** notes, JW Library interop, on-device full-text search, or a return of the general e-reader features the fork removed (OPDS, KOReader sync, dictionary, TXT/XTC).
          required: true
        - label: This is **not** an interactive app, an active-connectivity feature (RSS, news, browser, background polling), or PDF rendering.
          required: true
        - label: This is **not** support for a board other than the Xteink X4 Pro.
          required: true
        - label: It is not already on the roadmap for a later phase.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What reading or study problem does this address? Be concrete about when it happens.
      placeholder: e.g. "Returning to the verse a cross-reference came from takes four presses because..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Why an existing screen or setting cannot do this
      description: Which of the screens that already exist you tried, and where they fall short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would build. User impact first; implementation can come later.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: Cost in memory, flash, and refreshes
      description: |
        Internal SRAM is the tight resource (~380 KB class); PSRAM is plentiful but an order of
        magnitude slower and unusable from an ISR. Every screen costs a full panel refresh. Roughly
        what does this add, and where does it live?
      placeholder: e.g. "~4 KB of flash for the lookup table; the index stays in PSRAM; adds no screen to the reading path."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else relevant — screenshots, a sample publication, a related issue.
    validations:
      required: false
